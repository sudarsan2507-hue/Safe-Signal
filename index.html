<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <!-- viewport-fit=cover so the layout reaches under notches and home bars -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="SafeSignal — a quiet way to ask for help. Runs entirely on your device." />
  <!-- Follows the viewer's theme rather than forcing one. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f2" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16191a" />

  <!-- Installable to a home screen: one tap instead of finding a browser tab. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SafeSignal" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <title>SafeSignal</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
